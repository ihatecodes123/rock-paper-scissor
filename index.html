<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissor">Scissor</button>

    <div id="result"></div>
    
     
   <script>

    let humanScore=0;
    let computerScore=0;


    function getComputerChoice() {
    let rand = Math.random();
    if (rand <= 0.33) return "rock";
    if (rand <= 0.66) return "paper";
    return "scissor";
    }

    const resultsDiv=document.getElementById("result");

    function updateResult(message){
        const p=document.createElement("p");
        p.textContent=message;
        resultsDiv.appendChild(p);
    }






    // playRound also inside playGame
    function playRound(humanChoice, computerChoice) {

        updateResult(`Human: ${humanChoice} | Computer: ${computerChoice}`);


        if (humanChoice === computerChoice) {
            updateResult("You tie!");
            return;
        }

        if (
            (humanChoice === "rock" && computerChoice === "scissor") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissor" && computerChoice === "paper")
        ) {
            humanScore++;
            updateResult("You win!!");
        } else {
            computerScore++;
            updateResult("You lose!");
        }

        updateResult(`Score => You: ${humanScore} | Computer: ${computerScore}`);
        
        if (humanScore === 5 || computerScore === 5) {
             if (humanScore > computerScore) {
             updateResult("🎉 You won the game!");
        } else {
             updateResult("💻 Computer won the game!");}

             document.getElementById("rock").disabled = true;
             document.getElementById("paper").disabled = true;
             document.getElementById("scissor").disabled = true;
    
    }}

    document.getElementById("rock").addEventListener("click",()=>{
        playRound("rock",getComputerChoice());
    });
    document.getElementById("paper").addEventListener("click",()=>{
        playRound("paper",getComputerChoice());
    });
    document.getElementById("scissor").addEventListener("click",()=>{
        playRound("scissor",getComputerChoice());
    });





    

    

</script>
</body>
</html>
