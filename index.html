<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     
   <script>
function getComputerChoice() {
    let rand = Math.random();
    if (rand <= 0.33) return "rock";
    if (rand <= 0.66) return "paper";
    return "scissor";
}

function getHumanChoice() {
    let choice = prompt("Pick rock, paper or scissor");
    return choice.toLowerCase().trim(); // lowercase & trim extra spaces
}

function playGame() {
    // Score variables inside playGame
    let humanScore = 0;
    let computerScore = 0;

    // playRound also inside playGame
    function playRound(humanChoice, computerChoice) {
        if (humanChoice === computerChoice) {
            console.log(`Tie! Both chose ${humanChoice}`);
            return;
        }

        if (
            (humanChoice === "rock" && computerChoice === "scissor") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissor" && computerChoice === "paper")
        ) {
            humanScore++;
            console.log(`You win! ${humanChoice} beats ${computerChoice}`);
        } else {
            computerScore++;
            console.log(`You lose! ${computerChoice} beats ${humanChoice}`);
        }
    }

    // Play 5 rounds
    for (let i = 1; i <= 5; i++) {
        console.log(`\nRound ${i}`);
        let humanSelection = getHumanChoice();
        let computerSelection = getComputerChoice();
        console.log(`Human: ${humanSelection} | Computer: ${computerSelection}`);
        playRound(humanSelection, computerSelection);
    }

    // Final score
    console.log("\nFinal Score:");
    console.log("Human:", humanScore);
    console.log("Computer:", computerScore);

    // Declare winner
    if (humanScore > computerScore) {
        console.log("🎉 You won the game!");
    } else if (computerScore > humanScore) {
        console.log("💻 Computer won the game!");
    } else {
        console.log("It's a tie game!");
    }
}

// Start the game
playGame();
</script>
</body>
</html>
